plugins {
  id 'com.android.application'
  id 'org.jetbrains.kotlin.android'
  id 'com.facebook.react'
  id 'expo-module-gradle-plugin'     // ये अब settings.gradle से resolve होगा!
  id 'expo-updates-gradle-plugin'    // expo-updates ka plugin
}

apply from: new File(rootDir, "../node_modules/expo/scripts/autolinking.gradle")

android {
  namespace 'com.underoneroof.underoneroof'
  compileSdk rootProject.ext.compileSdkVersion
  defaultConfig {
    applicationId 'com.underoneroof.underoneroof'
    minSdkVersion rootProject.ext.minSdkVersion
    targetSdkVersion rootProject.ext.targetSdkVersion
    versionCode 1
    versionName "1.0.0"
  }
  // … baaki sab …
}
