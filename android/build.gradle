buildscript {
  repositories {
    google()
    mavenCentral()
    // Expo native plugins के लिए
    maven { url("$rootDir/../node_modules/expo-modules-core/android/maven") }
    maven { url("$rootDir/../node_modules/expo-updates/android/maven") }
    maven { url("$rootDir/../node_modules/expo-font/android/maven") }
  }
  dependencies {
    classpath("com.android.tools.build:gradle:7.3.1")
    classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:1.7.10")
    classpath("com.facebook.react:react-native-gradle-plugin:0.76.9")
    // अब expo-updates plugin भी इधर declare करो
    classpath("expo.updates:expo-updates-gradle-plugin:0.27.4")
    // expo-module-gradle-plugin resolutionStrategy से काम हो जाएगा
  }
}

allprojects {
  repositories {
    mavenLocal()
    google()
    mavenCentral()
    maven { url("$rootDir/../node_modules/expo-modules-core/android/maven") }
    maven { url("$rootDir/../node_modules/expo-updates/android/maven") }
    maven { url("$rootDir/../node_modules/expo-font/android/maven") }
  }
}

tasks.register("clean", Delete) {
  delete(rootProject.buildDir)
}
