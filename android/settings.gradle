pluginManagement {
  repositories {
    gradlePluginPortal()
    google()
    mavenCentral()
    // Expo modules-core
    maven { url("$rootDir/../node_modules/expo-modules-core/android/maven") }
    // Expo updates plugin
    maven { url("$rootDir/../node_modules/expo-updates/android/maven") }
    // Expo font, notifications, sharing आदि
    maven { url("$rootDir/../node_modules/expo-font/android/maven") }
    // (अगर और Expo packages हैं जिनके पास android/maven है, वो भी add कर देना)
  }
  resolutionStrategy {
    eachPlugin { details ->
      if (details.requested.id.id == "expo-module-gradle-plugin") {
        details.useModule("expo.modules:expo-module-gradle-plugin:${details.requested.version}")
      }
      if (details.requested.id.id == "expo-updates-gradle-plugin") {
        details.useModule("expo.updates:expo-updates-gradle-plugin:${details.requested.version}")
      }
    }
  }
}

rootProject.name = "UnderOneRoof"
include(":app")

// Expo autolinking
apply from: new File(rootDir, "../node_modules/expo/scripts/autolinking.gradle")
useExpoModules()
